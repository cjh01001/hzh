<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💖 专属爱心</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #050510; /* 深邃夜空背景 */
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft YaHei", sans-serif;
        }

        /* 顶部文字样式 */
        .message {
            position: absolute;
            top: 15%;
            color: #ff9a9e;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff6b6b, 0 0 20px #ff6b6b;
            z-index: 10;
            animation: floatText 3s ease-in-out infinite;
            text-align: center;
            width: 100%;
        }

        /* 核心爱心容器 */
        .heart-container {
            position: relative;
            width: 150px;
            height: 150px;
            z-index: 5;
        }

        /* 爱心主体绘制 */
        .heart {
            background-color: #ff2e63;
            width: 100%;
            height: 100%;
            position: relative;
            transform: rotate(-45deg);
            box-shadow: 0 0 40px #ff2e63;
            animation: heartbeat 1.2s infinite;
        }

        .heart::before,
        .heart::after {
            content: "";
            background-color: #ff2e63;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 40px #ff2e63;
        }

        .heart::before {
            top: -50%;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 50%;
        }

        /* 动画定义 */
        @keyframes heartbeat {
            0% { transform: rotate(-45deg) scale(1); }
            15% { transform: rotate(-45deg) scale(1.15); }
            30% { transform: rotate(-45deg) scale(1); }
            45% { transform: rotate(-45deg) scale(1.15); }
            60% { transform: rotate(-45deg) scale(1); }
            100% { transform: rotate(-45deg) scale(1); }
        }

        @keyframes floatText {
            0%, 100% { transform: translateY(0); opacity: 0.8; }
            50% { transform: translateY(-10px); opacity: 1; }
        }

        /* 粒子画布 */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; /* 让点击事件穿透画布 */
        }

        /* 底部提示 */
        .hint {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- 这里的文字可以修改 -->
    <div class="message">送给笨蛋黄止慧小朋友 💕</div>

    <div class="heart-container">
        <div class="heart"></div>
    </div>

    <div class="hint">点一下屏幕会有惊喜哦 ✨</div>

    <!-- 粒子特效脚本 -->
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        // 初始化画布大小
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 粒子类
        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'ambient' (环境漂浮) or 'firework' (点击爆炸)
                
                if (type === 'firework') {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 5 + 2;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.life = 100;
                    this.color = `hsl(${Math.random() * 60 + 330}, 100%, 70%)`; // 粉色系
                    this.size = Math.random() * 3 + 2;
                } else {
                    // 环境粒子
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 1;
                    this.vy = (Math.random() - 0.5) * 1;
                    this.life = Math.random() * 100 + 100;
                    this.color = `rgba(255, 100, 150, ${Math.random() * 0.5})`;
                    this.size = Math.random() * 2;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.type === 'firework') {
                    this.life -= 2;
                    this.vy += 0.1; // 重力
                } else {
                    this.life--;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        // 生成环境粒子
        for (let i = 0; i < 50; i++) {
            particles.push(new Particle(0, 0, 'ambient'));
        }

        // 动画循环
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    // 如果是环境粒子，移除后补一个新的
                    if (p.type === 'ambient') {
                        particles.push(new Particle(0, 0, 'ambient'));
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate();

        // 点击产生爆炸特效
        document.body.addEventListener('click', (e) => {
            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(e.clientX, e.clientY, 'firework'));
            }
        });
        
        // 自动触发一次中心爆炸，增加开场气势
        setTimeout(() => {
             for (let i = 0; i < 30; i++) {
                particles.push(new Particle(width/2, height/2, 'firework'));
            }
        }, 500);

    </script>
</body>
</html>
