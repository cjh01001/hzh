<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💖 给黄芷慧的惊喜</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d0d15; /* 深色背景 */
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Microsoft YaHei", sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 初始引导层 */
        #intro-layer {
            text-align: center;
            z-index: 100;
            transition: opacity 0.8s ease;
        }

        h1 {
            color: #ffb7c5;
            font-size: 24px;
            margin-bottom: 40px;
            text-shadow: 0 0 10px rgba(255, 183, 197, 0.6);
            letter-spacing: 2px;
        }

        .btn-surprise {
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
            animation: pulse 1.5s infinite;
            outline: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 107, 107, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
        }

        /* 飘动的爱心样式 */
        .floating-heart {
            position: absolute;
            bottom: -50px;
            color: #ff4d6d;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* 防止挡住点击 */
            animation: floatUp linear forwards;
            text-shadow: 0 0 5px rgba(255, 77, 109, 0.8);
            white-space: nowrap;
        }

        /* 爱心形状容器 */
        .heart-shape {
            position: relative;
            display: inline-block;
            width: 40px; 
            height: 40px;
            background-color: currentColor;
            transform: rotate(-45deg);
            margin-right: 15px; /* 给文字留点空间 */
            box-shadow: 0 0 10px currentColor;
        }
        
        .heart-shape::before,
        .heart-shape::after {
            content: "";
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: currentColor;
            border-radius: 50%;
        }
        
        .heart-shape::before { top: -20px; left: 0; }
        .heart-shape::after { top: 0; left: 20px; }

        /* 文字样式 */
        .name-text {
            font-size: 14px;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            z-index: 2;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) scale(1.2) rotate(20deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- 初始引导层 -->
    <div id="intro-layer">
        <h1>送给笨蛋黄芷慧小朋友 💕</h1>
        <button class="btn-surprise" onclick="startSurprise()">✨ 点击有惊喜 ✨</button>
    </div>

    <script>
        let intervalId = null;

        function startSurprise() {
            // 1. 隐藏引导层
            const intro = document.getElementById('intro-layer');
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.display = 'none';
            }, 800);

            // 2. 开始生成爱心雨
            if (!intervalId) {
                createHeart(); // 立即生成一个
                intervalId = setInterval(createHeart, 300); // 每300毫秒生成一个
            }
            
            // 3. 点击屏幕任意位置也会额外生成
            document.body.addEventListener('click', (e) => {
                // 避免点到按钮本身触发两次（虽然按钮已经隐藏了）
                createHeartAt(e.clientX, e.clientY);
            });
        }

        function createHeart() {
            const x = Math.random() * window.innerWidth;
            createHeartAt(x, window.innerHeight + 50); // 从底部生成
        }

        function createHeartAt(x, y) {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            
            // 随机大小
            const scale = 0.8 + Math.random() * 0.6; 
            // 随机颜色（粉色系）
            const colors = ['#ff4d6d', '#ff758f', '#c9184a', '#ff8fa3'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            // 随机动画时长
            const duration = 3 + Math.random() * 4; 

            heart.style.left = x + 'px';
            heart.style.bottom = (y === window.innerHeight + 50 ? '-50px' : 'auto');
            if(y !== window.innerHeight + 50) heart.style.top = y + 'px'; // 如果是点击触发的，定位在点击处
            
            heart.style.color = randomColor;
            heart.style.animationDuration = duration + 's';
            heart.style.transform = `scale(${scale})`;

            // 构建内部结构：爱心图形 + 名字
            // 为了美观，我们用 CSS 画一个小爱心，旁边放名字
            heart.innerHTML = `
                <div class="heart-shape"></div>
                <span class="name-text">黄芷慧</span>
            `;

            document.body.appendChild(heart);

            // 动画结束后移除元素，防止页面卡顿
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }
    </script>
</body>
</html>
